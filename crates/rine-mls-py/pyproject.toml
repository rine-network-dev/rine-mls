[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "rine-mls"
description = "rine's MLS group core (RFC 9420) with the X-Wing post-quantum ciphersuite"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.urls]
Repository = "https://codeberg.org/rine/rine-src"
# PyPI renders this as a sidebar link, which is the only route a reader has to the
# notes: this package publishes WHEELS ONLY (scripts/publish-mls-native.sh in the
# rine-src monorepo — an sdist would turn "no wheel for your platform" into a doomed
# Rust compile), and the wheels are cross-built in a pinned builder, so shipping a
# file inside one costs a full rebuild of all six. The notes live at
# rine-mls/CHANGELOG.md, one file for both bindings because there is one release;
# the monorepo's changelog gate resolves it by walking up from this directory and
# holds the workspace version against it.
Changelog = "https://codeberg.org/rine/rine-mls/src/branch/main/CHANGELOG.md"

[tool.maturin]
module-name = "rine_mls"
# One abi3 wheel per platform covers every CPython from 3.9 up, which is what
# keeps the build matrix to platforms rather than platforms x versions.
#
# `maturin build --features X` REPLACES this list rather than adding to it, so
# any command that opts a feature in must spell `pyo3/extension-module` out
# alongside it — `tests/run.sh` does.
features = ["pyo3/extension-module"]
# PyO3 generates no stubs, so `rine_mls.pyi` beside this file is written by hand.
# maturin picks it up by name and ships it as `rine_mls/__init__.pyi` with a
# `py.typed` marker — no `include` entry needed, and adding one would publish a
# second copy. `tests/test_stub.py` keeps the stub honest.

[tool.uv]
# The version is dynamic (it comes from the workspace Cargo.toml) and the wheel is
# compiled from Rust, but uv's default cache key for a source directory is
# pyproject.toml alone. Without this list a path install (rine-sdk and fleet
# resolve rine-mls from here) reuses a wheel built from older source and a venv
# silently carries a previous release. Setting the list replaces the default, so
# pyproject.toml is spelled out again. Paths are relative to this directory and
# cover the binding, the core crate, the patched mls-rs, every manifest and the
# lockfile.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "rine_mls.pyi" },
    { file = "src/**/*.rs" },
    { file = "../rine-mls-core/Cargo.toml" },
    { file = "../rine-mls-core/src/**/*.rs" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
    { file = "../../vendor/**/Cargo.toml" },
    { file = "../../vendor/**/*.rs" },
]

[tool.pytest.ini_options]
# Declared so the crate's own tests root here rather than inheriting the
# backend's pytest configuration from the repository root.
testpaths = ["tests"]
