# cargo-deny — the supply-chain gate on rine's MLS core.
#
# 208 transitive packages sit on rine's E2EE path. `cargo fmt`, `clippy` and the
# test suite say nothing at all about any of them: whether one carries a
# published advisory, what its licence obliges rine to, or whether the
# dependency graph quietly grew a second copy of a crypto crate. This file is
# what `ci.sh`'s `cargo deny` stage checks, and it is deliberately strict —
# every relaxation below names the crate it is for and why.
#
# Run it directly with `cd rine-mls && cargo deny check`.

[graph]
# Only the targets rine actually ships an artifact for. Without this, cargo-deny
# also walks windows-*, wasi and redox dependency edges that no published addon
# or wheel contains, and an advisory against a crate rine never links would fail
# a gate it should not.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Everything the RustSec database knows about, at the strictest setting the tool
# offers: a published vulnerability, an unmaintained crate or a withdrawn
# version all fail the build rather than warn. There is no `ignore` list, and
# adding one is a decision to record and justify, not a formatting fix.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Allowlist, never a denylist: a licence nobody thought about fails the gate,
# instead of passing because it was not on a list of bad ones. These five are
# EXACTLY the licences the current graph resolves to, so there is no unused
# allowance sitting here to be mistaken for a considered decision. The whole
# MLS and crypto stack is permissive: Apache-2.0 or MIT for almost all of it,
# BSD-3-Clause for the dalek curve crates, ISC for libloading, Unicode-3.0 for
# unicode-ident. `memchr` is MIT OR Unlicense and is satisfied by the MIT half.
# The LLVM exception is `target-lexicon`, reached only as a build dependency of
# pyo3-build-config.
#
# A new dependency under any other licence is a decision someone has to make and
# write down here, which is the behaviour this list is for.
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

[bans]
# A second copy of a crate is the interesting case here, not a forbidden crate.
# Two versions of a crypto or MLS crate in one binary means two implementations
# of the same primitive, only one of which the exact-pinning in Cargo.toml is
# actually pinning — so duplicates are a warning by default and an error for the
# crates the E2EE path runs on.
# Three duplicates are present today and all three are warnings on every run,
# by design — none is a second copy of a primitive on the shipped path:
#   * `rand_core` 0.6.4 / 0.10.1 — 0.10.1 arrives only through `x-wing`, which
#     is a DEV dependency (the X-Wing cross-implementation check). It is in no
#     published addon or wheel.
#   * `sec1` 0.7.3 / 0.8.1 — both under mls-rs-crypto-rustcrypto's own graph.
#   * `syn` 2.0.119 / 3.0.3 — proc-macro build time only.
# Promoting any of them to an error would fail the gate on a state that has
# already been looked at, which is how a gate stops being read.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# OpenSSL is the dependency rine's portability story is built to avoid: the
# release matrix cross-compiles six platforms, and a native TLS library in the
# graph is what turns that into a per-platform system-library problem.
[[bans.deny]]
crate = "openssl-sys"
reason = "rine's crypto is pure Rust so the cross-build matrix stays a cargo concern; see rine-mls/Cargo.toml"

[[bans.deny]]
# One implementation of each primitive on the E2EE path. Duplicates here are an
# error rather than the graph-wide warning above, because the exact `=` pins in
# Cargo.toml only bind the copy rine names — a second version arriving through a
# transitive edge is precisely what those pins exist to make visible.
crate = "mls-rs"
deny-multiple-versions = true

[[bans.deny]]
crate = "mls-rs-core"
deny-multiple-versions = true

[[bans.deny]]
crate = "ed25519-dalek"
deny-multiple-versions = true

[[bans.deny]]
crate = "x25519-dalek"
deny-multiple-versions = true

[[bans.deny]]
crate = "libcrux-ml-kem"
deny-multiple-versions = true

[[bans.deny]]
crate = "zeroize"
deny-multiple-versions = true

[sources]
# crates.io and nothing else. A git dependency on the E2EE path would be a
# moving target no lockfile pin makes reproducible, and rine has none today —
# this keeps it that way.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
